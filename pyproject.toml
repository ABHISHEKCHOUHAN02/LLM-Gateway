[project]
name = "llm-gateway"
version = "0.3.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek chouhan", email = "abhishekchouhan12643@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.115,<1.0",
    "fastembed>=0.9.0",
    "google-genai>=2.32.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "openai>=3.36.1",
    "pandas>=3.1.0",
    "pgvector>=0.5.1",
    "prometheus-fastapi-instrumentator>=8.1.0",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.6",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.scripts]
llm-gateway = "llm_gateway:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
